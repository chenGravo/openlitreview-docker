name: 发布已验证的 Docker 源码

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 读取临时发布分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 校验并解包源码
        run: |
          echo "b518ecb21179ef383ff2c341af77ed4bb963ca1de792ec117b9ce17192631204  openlitreview-source.zip" | sha256sum --check -
          unzip -o openlitreview-source.zip
      - name: 发布干净项目树
        run: |
          rm -f openlitreview-source.zip .github/workflows/container-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Docker deployment kit"
          git push
